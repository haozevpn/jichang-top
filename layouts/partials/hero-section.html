{{- /* 首页英雄区块 - Hero Section */ -}}
<section class="hero-section" style="
  background: linear-gradient(135deg, rgba(124, 58, 237, 0.95) 0%, rgba(37, 99, 235, 0.9) 100%),
              url('/img/hero-bg.jpg') center/cover;
  padding: 5rem 2rem;
  text-align: center;
  color: white;
  margin-bottom: 3rem;
  border-radius: 0 0 24px 24px;
  position: relative;
  overflow: hidden;
">
  <div class="hero-content" style="max-width: 800px; margin: 0 auto; position: relative; z-index: 2;">
    <h1 style="font-size: 2.5rem; font-weight: 700; margin-bottom: 1rem; line-height: 1.2;">
      🚀 2026年最新<span style="color: #fbbf24;">稳定高速</span>机场推荐
    </h1>
    <p style="font-size: 1.2rem; margin-bottom: 2rem; opacity: 0.95; line-height: 1.6;">
      精选 <strong>IEPL/IPLC 专线机场</strong>，解锁流媒体与 AI 工具<br>
      深度测评 + 真实体验，助您找到最适合的翻墙梯子
    </p>
    <div class="hero-cta" style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
      <a href="/airport/" style="
        background: white;
        color: #7c3aed;
        padding: 0.875rem 2rem;
        border-radius: 999px;
        font-weight: 600;
        text-decoration: none;
        display: inline-block;
        transition: all 0.3s ease;
        box-shadow: 0 4px 14px rgba(0,0,0,0.1);
      " onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 20px rgba(0,0,0,0.15)';"
         onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 14px rgba(0,0,0,0.1)';">
        查看推荐机场
      </a>
      <a href="/categories/科学上网指南/" style="
        background: rgba(255,255,255,0.2);
        color: white;
        padding: 0.875rem 2rem;
        border-radius: 999px;
        font-weight: 600;
        text-decoration: none;
        display: inline-block;
        border: 2px solid white;
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
      " onmouseover="this.style.background='rgba(255,255,255,0.3)';"
         onmouseout="this.style.background='rgba(255,255,255,0.2)';">
        新手教程
      </a>
    </div>
  </div>

  {{- /* 装饰性渐变球 */ -}}
  <div style="
    position: absolute;
    top: -100px;
    right: -100px;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(251, 191, 36, 0.3) 0%, transparent 70%);
    border-radius: 50%;
    filter: blur(40px);
    z-index: 1;
  "></div>
  <div style="
    position: absolute;
    bottom: -80px;
    left: -80px;
    width: 250px;
    height: 250px;
    background: radial-gradient(circle, rgba(59, 130, 246, 0.3) 0%, transparent 70%);
    border-radius: 50%;
    filter: blur(40px);
    z-index: 1;
  "></div>
</section>
