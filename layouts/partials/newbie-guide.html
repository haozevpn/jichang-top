{{- /* 新手导航面板 - 4步上手流程 */ -}}

<div class="newbie-guide" style="
  background: linear-gradient(135deg, rgba(124, 58, 237, 0.05) 0%, rgba(37, 99, 235, 0.05) 100%);
  border: 2px solid var(--card-border);
  border-radius: 16px;
  padding: 2rem;
  margin: 2.5rem 0;
">
  <div style="text-align: center; margin-bottom: 2rem;">
    <h3 style="
      font-size: 1.5rem;
      margin: 0 0 0.5rem 0;
      color: var(--card-text-color);
    ">🚀 新手快速上手指南</h3>
    <p style="
      color: var(--text-secondary);
      margin: 0;
      font-size: 1rem;
    ">4步完成科学上网配置，5分钟即可开始使用</p>
  </div>

    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1.5rem;

      background: var(--card-background);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      transition: all 0.3s ease;
      border: 1px solid var(--card-border);
    " onmouseover="this.style.transform='translateY(-4px)'; this.style.boxShadow='0 8px 20px rgba(0,0,0,0.1)';"
       onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='none';">
      <div style="
        width: 60px;
        height: 60px;
        background: linear-gradient(135deg, #7c3aed 0%, #2563eb 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1rem;
        font-size: 1.8rem;
      ">1️⃣</div>

        font-size: 1.1rem;
        margin: 0 0 0.5rem 0;
        color: var(--card-text-color);
      ">选择机场</h4>
      <p style="
        font-size: 0.9rem;
        color: var(--text-secondary);
        margin: 0 0 1rem 0;
        line-height: 1.5;
      ">根据预算和需求从推荐列表中选择</p>
      <a href="/airport/" style="

    </div>
